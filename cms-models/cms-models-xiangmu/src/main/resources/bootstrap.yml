# Tomcat
server:
  port: 10668

# Spring
spring:
  application:
    # 应用名称
    name: cms-xiangmu
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      # 服务注册、配置拉取地址
      server-addr: 110.41.189.159:8848
      #  server-addr: 192.168.137.220:8848
      # 注册中心配置,作用: 1.服务发现 2.配置中心
      discovery:
        #todo 开发环境的命名空间,根据实际情况修改替换dev
        namespace: test
        # 测试环境的命名空间
#        namespace: test
        group: cms-project
      # 配置中心配置 ,作用: 1.动态刷新配置 2.配置分发
      config:
        namespace: dev
        group: cms-project
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - data-id: applicationXM-dev.yml
            group: cms-project
            namespace: dev



