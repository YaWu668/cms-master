# Tomcat
server:
  port: 100668

# Spring
spring:
  application:
    # 应用名称
    name: cms-xiangmu
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      # 服务注册、配置拉取地址
      server-addr: 127.0.0.1:8848
      #  server-addr: 192.168.137.220:8848
      discovery:
        namespace: dev
        group: cms-project
      config:
        namespace: dev
        group: cms-project
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - data-id: application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            group: cms-project
            namespace: dev
