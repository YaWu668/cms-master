# Tomcat
server:
  port: 10668

# Spring
spring:
  application:
    # 应用名称
    name: cms-xiangmu
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      # 服务注册、配置拉取地址
      server-addr: 110.41.189.159:8848
      #  server-addr: 192.168.137.220:8848
      discovery:
        namespace: dev
        group: cms-project
      config:
        namespace: dev
        group: cms-project
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - data-id: applicationXM-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            group: cms-project
            namespace: dev



mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 控制台打印完整带参数SQL语句
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    # 数据库字段映射到实体的驼峰命名规则
    db-column-underline: true
    # 数据库表映射到实体的驼峰命名规则
    db-table-underline: true
    # 开启驼峰命名规则
    map-underscore-to-camel-case: true
    db-config:
      # 主键类型
      id-type: auto
      # 数据库类型
      db-type: mysql
